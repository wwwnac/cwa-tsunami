
name: cwa-tsunami
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch CWA tsunami
        run: |
          mkdir -p data
          curl -sS --max-time 30 \
            "https://opendata.cwa.gov.tw/api/v1/rest/datastore/E-A0014-001?Authorization=${{ secrets.CWA_KEY }}&format=JSON&limit=10" \
            -o data/cwa_tsunami.json
          head -c 120 data/cwa_tsunami.json; echo
      - name: Commit
        id: commit
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add data/cwa_tsunami.json
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "update cwa tsunami"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
 
      - name: Purge jsDelivr cache
        if: steps.commit.outputs.changed == 'true'
        run: |
          curl -sS --max-time 20 "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/data/cwa_tsunami.json" || true
